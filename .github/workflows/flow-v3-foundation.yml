name: Flow V3 foundation guards (monorepo)

on:
  push:
    branches: [main, master]
    paths:
      - 'GuideXpert-Backend/**'
      - '.github/workflows/flow-v3-foundation.yml'
  pull_request:
    paths:
      - 'GuideXpert-Backend/**'
      - '.github/workflows/flow-v3-foundation.yml'
  workflow_dispatch:

jobs:
  guards-and-suite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GuideXpert-Backend
    env:
      FLOW_V3_REQUIRE_MONGO: '1'
      FLOW_V3_MANIFEST_STRICT: '1'
      ALLOW_REMOTE_AUTO_INDEX: '0'
      CHATBOT_FLOW_V3_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: GuideXpert-Backend/package-lock.json
      - run: npm ci
      - run: node scripts/ci/flowV3Guards.js
      - run: env -u MONGODB_URI -u MONGO_URI node --test test/flowV3/*.test.js test/outboundDuplicateGuard.test.js
      - run: node scripts/ci/counselingBaselineAllowlist.js
